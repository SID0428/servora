name: Keep Servora Render API awake

on:
  schedule:
    # Runs every 12 minutes (0, 12, 24, 36, 48) to guarantee triggering before Render's 15-minute idle sleep, even with runner queue delays.
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping-render-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Servora API health endpoint
        run: |
          echo "Pinging Servora API at $(date -u)"
          curl --fail --silent --show-error \
            --max-time 45 \
            --retry 3 \
            --retry-delay 5 \
            https://servora-3v6b.onrender.com/health
          echo "✓ Servora Render backend is awake and responding!"
