name: Keep Servora Render API awake

on:
  schedule:
    # Runs every 14 minutes, staggered away from the top of the hour.
    - cron: "3,17,31,45,59 * * * *"
  workflow_dispatch:

jobs:
  ping-render-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Servora API health endpoint
        run: >-
          curl --fail --silent --show-error
          --max-time 30
          --retry 3
          --retry-delay 5
          https://servora-3v6b.onrender.com/health
