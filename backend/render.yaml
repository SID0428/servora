services:
  - type: web
    name: servora-backend
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard to your Aiven MySQL connection URL
      - key: ALLOWED_ORIGINS
        sync: false # Set to your Vercel production domain and any preview domain you use
      - key: DEMO_PASSWORD
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: ServSure
      - key: FRONTEND_BASE_URL
        value: https://servsure.vercel.app
      - key: KEEP_ALIVE_INTERVAL_SECONDS
        value: "840" # 14 minutes (Render idle sleep threshold is 15 minutes)
      - key: PING_URL
        value: https://servora-3v6b.onrender.com
