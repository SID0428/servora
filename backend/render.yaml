services:
  - type: web
    name: servora-backend
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard to your Aiven MySQL connection URL
      - key: ALLOWED_ORIGINS
        sync: false # Set to your Vercel production domain and any preview domain you use
      - key: DEMO_PASSWORD
        generateValue: true
